
services:
  postgres:
    image: postgres:16.11-alpine3.23
    container_name: payment-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Ho_Chi_Minh

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  broker:
    image: apache/kafka:3.7.0
    container_name: broker
    hostname: broker
    restart: unless-stopped

    ports:
      # Client bên ngoài Docker (localhost)
      - "9092:9092"

    environment:
      # ===== KRaft basic =====
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # ===== Listener security =====
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      # ===== Kafka lắng nghe bên trong container =====
      KAFKA_LISTENERS: >
        PLAINTEXT://0.0.0.0:29092,
        PLAINTEXT_HOST://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:29093

      # ===== Kafka advertise cho client =====
      # Docker internal -> broker:29092
      # External (local dev / prod edge) -> localhost:9092
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://broker:29092,
        PLAINTEXT_HOST://localhost:9092

      # ===== Inter broker & controller =====
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093

      # ===== System topics (single broker) =====
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # ===== Storage =====
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # ===== Cluster ID =====
      # Chỉ giữ nếu volume là mới. Nếu lỗi -> docker compose down -v
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      # PHẢI dùng listener nội bộ
      test:
        [
          "CMD-SHELL",
          "opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --list || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  akhq:
    image: tchiotludo/akhq:0.25.0
    container_name: payment-akhq
    restart: unless-stopped

    depends_on:
      broker:
        condition: service_healthy

    ports:
      - "${AKHQ_PORT:-8080}:8080"

    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            kafka-docker:
              properties:
                bootstrap.servers: "broker:29092"

  # Payment Gateway Application
  payment-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-gateway
    restart: unless-stopped

    ports:
      - "8085:8085"

    environment:
      # Database Configuration
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-payment_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-300}

      # Kafka Configuration
      KAFKA_BROKER: ${KAFKA_BROKER:-broker:29092}
      KAFKA_PRODUCER_TOPIC: ${KAFKA_PRODUCER_TOPIC:-transaction_create}
      KAFKA_CONSUMER_TOPIC: ${KAFKA_CONSUMER_TOPIC:-consumer_topic}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-consumer_group}
      KAFKA_PRODUCER_ACKS: ${KAFKA_PRODUCER_ACKS:-all}
      KAFKA_PRODUCER_RETRIES: ${KAFKA_PRODUCER_RETRIES:-5}
      KAFKA_PRODUCER_MAX_IN_FLIGHT: ${KAFKA_PRODUCER_MAX_IN_FLIGHT:-5}
      KAFKA_PRODUCER_ENABLE_IDEMPOTENCE: ${KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:-true}
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:-earliest}
      KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: ${KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:-true}

      # Application Configuration
      TZ: Asia/Ho_Chi_Minh

    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Uncomment để sử dụng network mode host (kết nối trực tiếp với services bên ngoài)
    # network_mode: "host"

volumes:
  postgres_data:
  kafka_data:
