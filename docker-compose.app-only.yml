services:
  # Payment Gateway Application - Standalone mode
  # Chỉ chạy app, kết nối tới các Docker services đã chạy sẵn
  payment-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-gateway
    restart: unless-stopped

    # Expose port 8085 để có thể gọi API từ bên ngoài
    ports:
      - "8085:8085"

    environment:
      # Database Configuration - Kết nối tới PostgreSQL container
      # Sử dụng container name và internal port
      DB_HOST: payment-postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 123456
      DB_NAME: payment_db
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: 10
      DB_MAX_IDLE_CONNS: 5
      DB_CONN_MAX_LIFETIME: 300

      # Kafka Configuration - Kết nối tới Kafka container
      # Sử dụng container name và internal port
      KAFKA_BROKER: broker:29092
      KAFKA_PRODUCER_TOPIC: transaction_create
      KAFKA_CONSUMER_TOPIC: consumer_topic
      KAFKA_CONSUMER_GROUP_ID: consumer_group
      KAFKA_PRODUCER_ACKS: all
      KAFKA_PRODUCER_RETRIES: 5
      KAFKA_PRODUCER_MAX_IN_FLIGHT: 5
      KAFKA_PRODUCER_ENABLE_IDEMPOTENCE: true
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: true
      KAFKA_CONSUMER_ISOLATION_LEVEL: read_committed
      KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS: 20000

      # Polling Configuration
      POLLING_MAX_TIMEOUT: 60000

      # Application Configuration
      TZ: Asia/Ho_Chi_Minh

    # Kết nối vào network của docker-compose chính
    # Network này được tạo bởi docker-compose.yml khi start postgres + kafka
    networks:
      - go-payment-gateway_default

    # External containers reference (optional - for documentation)
    external_links:
      - payment-postgres:postgres
      - broker:kafka

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/api/transactions || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Sử dụng external network từ docker-compose.yml chính
# Network này được tạo tự động với tên: <foldername>_default
# Hoặc custom name nếu được định nghĩa trong docker-compose.yml
networks:
  go-payment-gateway_default:
    external: true
    name: go-payment-gateway_default
